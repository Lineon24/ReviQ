[project]
name = "reviq-analysis"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "crewai==1.15.2",
  "fastapi>=0.117,<1",
  "uvicorn>=0.35,<1",
  "openai>=2.30,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
